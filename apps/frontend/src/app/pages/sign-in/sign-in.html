<section class="flex min-h-screen w-full flex-col lg:flex-row bg-white">
  <!-- Left Side: 3D Artwork Hero Banner -->
  <div
    class="relative flex w-full lg:w-1/2 min-h-[340px] lg:min-h-screen items-center justify-center p-8 lg:p-16 overflow-hidden select-none"
    style="background: linear-gradient(135deg, #3d348b 0%, #463ba2 35%, #769a3c 70%, #a8c738 100%);"
  >
    <!-- Background subtle ambient lighting glow -->
    <div class="absolute -top-24 -left-24 h-96 w-96 rounded-full bg-white/10 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 h-96 w-96 rounded-full bg-emerald-400/15 blur-3xl pointer-events-none"></div>

    <!-- 3D Guze Coin Artwork -->
    <div class="relative z-10 flex items-center justify-center max-w-[480px] w-full transition-transform duration-700 hover:scale-[1.03]">
      <img
        src="images/guze_coin.png"
        alt="Guze 3D Coin"
        class="w-full h-auto object-contain drop-shadow-[0_25px_35px_rgba(0,0,0,0.35)] pointer-events-none"
      />
    </div>
  </div>

  <!-- Right Side: Clean Authentication Form -->
  <div class="flex w-full lg:w-1/2 min-h-screen flex-col items-center justify-center px-6 sm:px-12 lg:px-20 py-12 bg-white">
    <div class="flex w-full max-w-[420px] flex-col items-center">
      <!-- Guze Markets Logo -->
      <div class="mb-8 flex items-center justify-center">
        <img
          src="images/logo/guze_logo.svg"
          alt="GUZE MARKETS"
          class="h-20 sm:h-22 w-auto object-contain select-none"
        />
      </div>

      <!-- Sign In / Create Account Navigation Tabs -->
      <div class="flex w-full border-b border-gray-200 mb-7">
        <button
          type="button"
          (click)="setTab('signin')"
          class="flex-1 pb-2.5 text-center text-sm transition-all cursor-pointer font-bold relative"
          [ngClass]="
            activeTab() === 'signin'
              ? 'text-[#05028d] border-b-2 border-[#05028d]'
              : 'text-gray-400 hover:text-gray-600 font-medium'
          "
        >
          Sign in
        </button>
        <button
          type="button"
          (click)="setTab('create')"
          class="flex-1 pb-2.5 text-center text-sm transition-all cursor-pointer font-medium relative"
          [ngClass]="
            activeTab() === 'create'
              ? 'text-[#05028d] border-b-2 border-[#05028d] font-bold'
              : 'text-gray-400 hover:text-gray-600'
          "
        >
          Create Account
        </button>
      </div>

      <!-- Error Notification Banner -->
      @if (errorMessage()) {
        <div class="mb-5 flex w-full items-center gap-2.5 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-xs text-rose-700 animate-fadeIn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4 shrink-0 text-rose-600">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span class="font-medium leading-relaxed">{{ errorMessage() }}</span>
        </div>
      }

      <!-- Sign In Form -->
      <form (ngSubmit)="onSubmit()" class="flex w-full flex-col">
        <!-- Email / Username Input -->
        <div class="relative w-full mb-3.5">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#3d348b]">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </span>
          <input
            id="signin-email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="|Typing"
            required
            autocomplete="email"
            class="w-full rounded-xl border-2 border-[#3d348b] bg-white py-3 pl-11 pr-4 text-sm font-semibold text-gray-900 outline-none placeholder:text-gray-400 focus:ring-2 focus:ring-[#3d348b]/20 transition-all"
          />
        </div>

        <!-- Password Input -->
        <div class="relative w-full mb-4">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input
            id="signin-password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Password*"
            required
            autocomplete="current-password"
            class="w-full rounded-xl border border-gray-200 bg-[#f8f9fa] py-3 pl-11 pr-11 text-sm font-semibold text-gray-900 outline-none placeholder:text-gray-400 focus:bg-white focus:border-[#3d348b] focus:ring-2 focus:ring-[#3d348b]/20 transition-all"
          />
          <button
            type="button"
            (click)="toggleShowPassword()"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"
            title="Toggle password visibility"
          >
            @if (showPassword()) {
              <!-- Eye Open Icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            } @else {
              <!-- Eye Slash Icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            }
          </button>
        </div>

        <!-- Keep me signed in? Switch -->
        <div class="flex items-center gap-2.5 w-full mb-6">
          <button
            type="button"
            (click)="toggleKeepSignedIn()"
            role="switch"
            [attr.aria-checked]="keepSignedIn()"
            class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none"
            [ngClass]="keepSignedIn() ? 'bg-[#b4d626]' : 'bg-gray-200'"
          >
            <span
              class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow-sm ring-0 transition duration-200 ease-in-out"
              [ngClass]="keepSignedIn() ? 'translate-x-4' : 'translate-x-0'"
            ></span>
          </button>
          <span
            (click)="toggleKeepSignedIn()"
            class="text-xs text-gray-400 font-normal cursor-pointer select-none hover:text-gray-600 transition-colors"
          >
            Keep me signed in?
          </span>
        </div>

        <!-- Sign In Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full flex items-center justify-center gap-2 py-3.5 px-6 rounded-full bg-[#b4d626] hover:bg-[#a3c71b] active:scale-[0.99] text-[#1e2a07] font-bold text-sm tracking-wide shadow-md shadow-[#b4d626]/30 transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (isLoading()) {
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-[#1e2a07]" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Signing in...</span>
          } @else {
            <span>Sign In</span>
          }
        </button>

        <!-- Quick Member Selector (Dev/Demo convenience) -->
        <div class="mt-4 flex items-center justify-center gap-2 text-[11px] text-gray-400">
          <span>Quick fill:</span>
          <button
            type="button"
            (click)="fillUser('alice@example.test')"
            class="text-xs font-semibold text-[#05028d] hover:underline cursor-pointer"
          >
            Alice
          </button>
          <span>•</span>
          <button
            type="button"
            (click)="fillUser('bob@example.test')"
            class="text-xs font-semibold text-[#05028d] hover:underline cursor-pointer"
          >
            Bob
          </button>
          <span>•</span>
          <button
            type="button"
            (click)="fillUser('carol@example.test')"
            class="text-xs font-semibold text-[#05028d] hover:underline cursor-pointer"
          >
            Carol
          </button>
        </div>

        <!-- Don't have an account? Sign up Now! -->
        <div class="mt-8 text-center text-xs text-gray-500 font-medium">
          Don't have an account?
          <a
            (click)="setTab('create')"
            class="text-[#05028d] font-bold hover:underline cursor-pointer ml-1"
          >
            Sign up Now!
          </a>
        </div>

        <!-- Forgot Password Link -->
        <div class="mt-10 flex items-center justify-center">
          <a
            class="inline-flex items-center gap-1.5 text-xs font-semibold text-[#a4cb38] hover:text-[#8cb320] transition-colors cursor-pointer"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4">
              <circle cx="7.5" cy="15.5" r="5.5"></circle>
              <path d="m21 2-9.6 9.6"></path>
              <path d="m15.5 7.5 3 3L22 7l-3-3"></path>
            </svg>
            <span>Forgot Password?</span>
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- Guzebot Floating Chat for Guest Public FAQ -->
  <app-guzebot-chat [initialMode]="'chat-minimized'" [isGuest]="true" />
</section>
